
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Fee Portal - Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f7f2df;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: #465338;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            font-size: 19px;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #79834d;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .main-content h1 {
            color: #465338;
            margin-bottom: 10px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0000000d;
        }

        .card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .card p {
            color: #909747;
            font-size: 27px;
            font-weight: bold;
        }

        .logout {
            margin-top: 30px;
            display: inline-block;
            background: #a0a448;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 145px;
            }

            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Membership Fee Portal</h2>

            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="#">Membership Fee</a>
            <a href="#">Transactions</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main class="main-content">
            <h1>Dashboard</h1>
            <p>Welcome to the Membership Fee Portal!</p>

            <div class="cards">
                <div class="card">
                    <h3>Total Members</h3>
                    <p>0</p>
                </div>

                <div class="card">
                    <h3>Fees Collected</h3>
                    <p>₱0</p>
                </div>

                <div class="card">
                    <h3>Pending Payments</h3>
                    <p>0</p>
                </div>
            </div>

            <a href="index.html" class="logout">Logout</a>
        </main>

    </div>

</body>
</html>
